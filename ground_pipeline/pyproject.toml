[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ground-pipeline"
version = "0.1.0"
description = "Ground-plane extraction from metric depth, camera intrinsics, and a floor mask"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23.5", "Pillow>=9.0"]

[project.scripts]
ground-pipeline = "ground_pipeline.__main__:main"

[tool.setuptools]
packages = ["ground_pipeline"]

[tool.setuptools.package-dir]
ground_pipeline = "."
